<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="propical">
  <!-- Brandbook variant "a · uso principal" (docs/ux/index.html §06):
       gradient tile (âmbar #F2A93B → coral #FF6A47), full areia sun,
       noite house silhouette. The 120px corner radius matches the iOS /
       Android home-screen mask treatment so the icon looks intentional
       everywhere (rounded on iOS, rounded clipped on Android, full square
       in browsers that use the SVG as-is). -->
  <defs>
    <linearGradient id="pc-fav-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#FF6A47"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#pc-fav-grad)"/>
  <!-- Brandbook 120-unit geometry scaled by 4.2667 (= 512 / 120). -->
  <g transform="scale(4.2667)">
    <circle cx="74" cy="40" r="26" fill="#FAF5EC"/>
    <path d="M48 36 L24 64 L24 88 L72 88 L72 64 Z" fill="#241A10"/>
  </g>
</svg>
